<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTLlearning - Welcome</title>
    <link rel="stylesheet" href="/css/output.css">
</head>

<body class="min-h-min flex items-center justify-center p-4 sm:p-6 md:p-8 text-slate-100 font-sans [background:radial-gradient(circle_at_15%_20%,#26305a_0%,transparent_45%),radial-gradient(circle_at_85%_80%,#263a5a_0%,transparent_45%),#0d1424]">

<div class="w-5/6 max-w-130 rounded-3xl border border-[#2a3454] p-5 sm:p-7 md:p-9 pb-6 md:pb-7 bg-linear-to-b from-[#141a2e] to-[#0f1424] shadow-[0_40px_80px_rgba(0,0,0,0.45)]">

  <!-- Heading -->
  <div class="text-center mb-6 md:mb-7">
    <div class="text-xs md:text-[13px] font-semibold text-[#9aa3bf] tracking-[4px] md:tracking-[6px]">WELCOME TO</div>
    <div class="flex items-center justify-center gap-2.5 mt-2.5 text-lg sm:text-xl md:text-[22px] font-semibold">
      <div class="w-7 h-7 md:w-7.5 md:h-7.5 rounded-lg bg-[#111528] border border-[#2a3454] flex items-center justify-center text-[11px] md:text-xs font-bold text-red-400">RTL</div>
      <span>RT Learning</span>
    </div>
  </div>

  <!-- Stages -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 md:gap-4 my-6 md:my-8">

    <div class="relative bg-[#1c2540] border border-[#2a3454] hover:border-2 hover:border-blue-500 rounded-2xl p-4 sm:p-4 md:p-4.5 sm:min-h-27.5 md:min-h-30 flex flex-row sm:flex-col justify-between items-center sm:items-stretch cursor-pointer transition hover:-translate-y-0.5">
      <div>
        <div class="text-[11px] tracking-wide text-[#9aa3bf] mb-1 sm:mb-2">STAGE 01</div>
        <div class="text-base md:text-[17px] font-semibold mb-1 sm:mb-1.5">Beginner</div>
        <div class="text-[13px] text-[#3ddc97] font-semibold">A1- A2</div>
      </div>
      <div class="text-xs text-[#9aa3bf] sm:mt-3.5">60 hrs to target</div>
    </div>

    <div class="relative bg-[#1c2540] border border-[#2a3454] hover:border-2 hover:border-blue-500 rounded-2xl p-4 sm:p-4 md:p-4.5 sm:min-h-27.5 md:min-h-30 flex flex-row sm:flex-col justify-between items-center sm:items-stretch cursor-pointer transition hover:-translate-y-0.5 ">
      <span class="hidden sm:block absolute -top-2.25 left-1/2 -translate-x-1/2 bg-slate-300 text-slate-900 text-[10px] font-bold tracking-wide px-3 py-1 rounded-lg">RECOMMENDED</span>
      <div>
        <div class="text-[11px] tracking-wide text-[#9aa3bf] mb-1 sm:mb-2">STAGE 02</div>
        <div class="text-base md:text-[17px] font-semibold mb-1 sm:mb-1.5">Intermediate</div>
        <div class="text-[13px] text-[#3ddc97] font-semibold">B1 - B2</div>
      </div>
      <div class="text-xs text-[#9aa3bf] sm:mt-3.5">Most popular</div>
    </div>

    <div class="relative bg-[#1c2540] border border-[#2a3454] hover:border-2 hover:border-blue-500 rounded-2xl p-4 sm:p-4 md:p-4.5 sm:min-h-27.5 md:min-h-30 flex flex-row sm:flex-col justify-between items-center sm:items-stretch cursor-pointer transition hover:-translate-y-0.5">
      <div>
        <div class="text-[11px] tracking-wide text-[#9aa3bf] mb-1 sm:mb-2">STAGE 03</div>
        <div class="text-base md:text-[17px] font-semibold mb-1 sm:mb-1.5">Advanced</div>
        <div class="text-[13px] text-[#3ddc97] font-semibold">B1 - B2</div>
      </div>
      <div class="text-xs text-[#9aa3bf] sm:mt-3.5">Fluency polish</div>
    </div>
  </div>

  <!-- Socials -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mb-5 md:mb-6">
    <button class="flex items-center gap-3 bg-[#1c2540] border border-[#2a3454] rounded-xl px-4 py-3 text-[13px] md:text-sm hover:border-slate-500 transition">
      <span class="w-5.5 h-5.5 rounded-full bg-white text-[#4285F4] flex items-center justify-center text-[13px] font-bold shrink-0">G</span>
      with google account
    </button>
    <button class="flex items-center gap-3 bg-[#1c2540] border border-[#2a3454] rounded-xl px-4 py-3 text-[13px] md:text-sm hover:border-slate-500 transition">
      <span class="w-5.5 h-5.5 rounded-full bg-[#1877F2] text-white flex items-center justify-center text-[13px] font-bold shrink-0">f</span>
      with facebook account
    </button>
  </div>

  <!-- Divider -->
  <div class="flex items-center gap-4 text-[#9aa3bf] text-[13px] my-5 md:my-6">
    <span class="flex-1 h-px bg-[#2a3454]"></span>
    or
    <span class="flex-1 h-px bg-[#2a3454]"></span>
  </div>

  <!-- Email -->
  <div class="mb-5">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs md:text-[13px] font-semibold">Your Email</span>
      <span class="text-xs text-[#3ddc97] flex items-center gap-1">✓ Verified ID</span>
    </div>
    <div class="flex items-center gap-3 bg-[#1c2540] border border-[#2a3454] rounded-xl px-4 py-3">
      <span class="text-[#9aa3bf] text-[15px]">@</span>
      <input type="email" placeholder="Enter your email"
             class="flex-1 bg-transparent border-none outline-none text-slate-100 text-[13px] md:text-sm">
    </div>
  </div>

  <!-- Password -->
  <div class="mb-5">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs md:text-[13px] font-semibold">Your Password</span>
      <span class="text-xs text-[#9aa3bf] cursor-pointer">Forgot?</span>
    </div>
    <div class="flex items-center gap-3 bg-[#1c2540] border border-[#2a3454] rounded-xl px-4 py-3">
      <span class="text-[#9aa3bf] text-[15px]">🔑</span>
      <input type="password" id="pwd" value="123456789" placeholder="Enter your password"
             class="flex-1 bg-transparent border-none outline-none text-slate-100 text-[13px] md:text-sm">
      <button onclick="togglePwd()" class="bg-transparent border-none cursor-pointer text-[#9aa3bf] text-[15px]">🚫👁</button>
    </div>
  </div>

  <!-- Remember -->
  <label class="flex items-center gap-2.5 text-[#9aa3bf] text-[13px] my-1.5 mb-6 md:mb-7 cursor-pointer">
    <input type="checkbox" class="w-4 h-4 accent-[#6c6ef0]">
    Remember me for 30 days
  </label>

  <!-- CTA -->
  <button class="w-full py-3.5 md:py-4 rounded-2xl text-white text-sm md:text-[15px] font-semibold flex items-center justify-center gap-2.5 hover:brightness-110 transition bg-linear-to-b from-[#7b7ff5] to-[#6c6ef0]  hover:-translate-y-0.5">
    Start Learning Free →
  </button>

</div>

<script>
function togglePwd(){
  const pwd = document.getElementById('pwd');
  pwd.type = pwd.type === 'password' ? 'text' : 'password';
}
</script>

</body>

</html>
