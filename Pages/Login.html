<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTLlearning - Welcome</title>
    <link rel="stylesheet" href="../css/output.css">
</head>

<body class="min-h-min flex items-center justify-center p-4 sm:p-6 md:p-8 text-slate-100 font-sans [background:radial-gradient(circle_at_15%_20%,#26305a_0%,transparent_45%),radial-gradient(circle_at_85%_80%,#263a5a_0%,transparent_45%),#0d1424]">

<div class="w-5/6 max-w-130 rounded-3xl border border-[#2a3454] p-5 sm:p-7 md:p-9 pb-6 md:pb-7 bg-linear-to-b from-[#141a2e] to-[#0f1424] shadow-[0_40px_80px_rgba(0,0,0,0.45)]">

  <!-- Heading -->
  <div class="text-center mb-6 md:mb-7">
    <div class="text-xs md:text-[13px] font-semibold text-[#9aa3bf] tracking-[4px] md:tracking-[6px]">WELCOME TO</div>
    <div class="flex items-center justify-center gap-2.5 mt-2.5 text-lg sm:text-xl md:text-[22px] font-semibold">
      <div class="w-7 h-7 md:w-7.5 md:h-7.5 rounded-lg bg-[#111528] border border-[#2a3454] flex items-center justify-center text-[11px] md:text-xs font-bold text-red-400">RTL</div>
      <span>RT Learning</span>
    </div>
  </div>

  <!-- Stages -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 md:gap-4 my-6 md:my-8">

    <div class="relative bg-[#1c2540] border border-[#2a3454] hover:border-2 hover:border-blue-500 rounded-2xl p-4 sm:p-4 md:p-4.5 sm:min-h-27.5 md:min-h-30 flex flex-row sm:flex-col justify-between items-center sm:items-stretch cursor-pointer transition hover:-translate-y-0.5">
      <div>
        <div class="text-[11px] tracking-wide text-[#9aa3bf] mb-1 sm:mb-2">STAGE 01</div>
        <div class="text-base md:text-[17px] font-semibold mb-1 sm:mb-1.5">Beginner</div>
        <div class="text-[13px] text-[#3ddc97] font-semibold">A1- A2</div>
      </div>
      <div class="text-xs text-[#9aa3bf] sm:mt-3.5">60 hrs to target</div>
    </div>

    <div class="relative bg-[#1c2540] border border-[#2a3454] hover:border-2 hover:border-blue-500 rounded-2xl p-4 sm:p-4 md:p-4.5 sm:min-h-27.5 md:min-h-30 flex flex-row sm:flex-col justify-between items-center sm:items-stretch cursor-pointer transition hover:-translate-y-0.5 ">
      <span class="hidden sm:block absolute -top-2.25 left-1/2 -translate-x-1/2 bg-slate-300 text-slate-900 text-[10px] font-bold tracking-wide px-3 py-1 rounded-lg">RECOMMENDED</span>
      <div>
        <div class="text-[11px] tracking-wide text-[#9aa3bf] mb-1 sm:mb-2">STAGE 02</div>
        <div class="text-base md:text-[17px] font-semibold mb-1 sm:mb-1.5">Intermediate</div>
        <div class="text-[13px] text-[#3ddc97] font-semibold">B1 - B2</div>
      </div>
      <div class="text-xs text-[#9aa3bf] sm:mt-3.5">Most popular</div>
    </div>

    <div class="relative bg-[#1c2540] border border-[#2a3454] hover:border-2 hover:border-blue-500 rounded-2xl p-4 sm:p-4 md:p-4.5 sm:min-h-27.5 md:min-h-30 flex flex-row sm:flex-col justify-between items-center sm:items-stretch cursor-pointer transition hover:-translate-y-0.5">
      <div>
        <div class="text-[11px] tracking-wide text-[#9aa3bf] mb-1 sm:mb-2">STAGE 03</div>
        <div class="text-base md:text-[17px] font-semibold mb-1 sm:mb-1.5">Advanced</div>
        <div class="text-[13px] text-[#3ddc97] font-semibold">B1 - B2</div>
      </div>
      <div class="text-xs text-[#9aa3bf] sm:mt-3.5">Fluency polish</div>
    </div>
  </div>

  <!-- Socials -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mb-5 md:mb-6">
    <button class="flex items-center gap-3 bg-[#1c2540] border border-[#2a3454] rounded-xl px-4 py-3 text-[13px] md:text-sm hover:border-slate-500 transition">
      <svg class="w-5 h-5 rounded-full bg-white p-1 text-[#4285F4] shrink-0" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
      </svg>
      with google account
    </button>
    <button class="flex items-center gap-3 bg-[#1c2540] border border-[#2a3454] rounded-xl px-4 py-3 text-[13px] md:text-sm hover:border-slate-500 transition">
      <svg class="w-5 h-5 rounded-full bg-[#1877F2] p-0.5 shrink-0" viewBox="0 0 24 24" fill="#fff">
        <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07z"/>
      </svg>
      with facebook account
    </button>
  </div>

  <!-- Divider -->
  <div class="flex items-center gap-4 text-[#9aa3bf] text-[13px] my-5 md:my-6">
    <span class="flex-1 h-px bg-[#2a3454]"></span>
    or
    <span class="flex-1 h-px bg-[#2a3454]"></span>
  </div>

  <!-- Email -->
  <div class="mb-5">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs md:text-[13px] font-semibold">Your Email</span>
      <span class="text-xs text-[#3ddc97] flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.5 12.5 2.5 2.5 4.5-5"/>
        </svg>
        Verified ID
      </span>
    </div>
    <div class="flex items-center gap-3 bg-[#1c2540] border border-[#2a3454] rounded-xl px-4 py-3">
      <svg class="w-4.5 h-4.5 text-[#9aa3bf] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="m3.5 7.5 7.9 5.27a1 1 0 0 0 1.2 0L20.5 7.5"/>
      </svg>
      <input type="email" placeholder="Enter your email"
             class="flex-1 bg-transparent border-none outline-none text-slate-100 text-[13px] md:text-sm">
    </div>
  </div>

  <!-- Password -->
  <div class="mb-5">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs md:text-[13px] font-semibold">Your Password</span>
      <span class="text-xs text-[#9aa3bf] cursor-pointer">Forgot?</span>
    </div>
    <div class="flex items-center gap-3 bg-[#1c2540] border border-[#2a3454] rounded-xl px-4 py-3">
      <svg class="w-4.5 h-4.5 text-[#9aa3bf] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10.5V7a4 4 0 1 1 8 0v3.5"/>
        <circle cx="12" cy="15.75" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
      <input type="password" id="pwd" value="123456789" placeholder="Enter your password"
             class="flex-1 bg-transparent border-none outline-none text-slate-100 text-[13px] md:text-sm">
      <button onclick="togglePwd()" aria-label="Show or hide password"
              class="bg-transparent border-none cursor-pointer text-[#9aa3bf]  transition shrink-0">
        <svg id="eyeOpen" class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eyeOff" class="w-4.5 h-4.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5.5 12 5.5c1.62 0 3.01.47 4.2 1.13M21.5 12S18 18.5 12 18.5c-1.62 0-3.01-.47-4.2-1.13"/>
          <path stroke-linecap="round" d="m4 20 16-16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Remember -->
  <label class="flex items-center gap-2.5 text-[#9aa3bf] text-[13px] my-1.5 mb-6 md:mb-7 cursor-pointer">
    <input type="checkbox" class="w-4 h-4 accent-[#6c6ef0]">
    Remember me for 30 days
  </label>

  <!-- CTA -->
  <a href="../index.html" class="block w-full py-3.5 md:py-4 rounded-2xl text-white text-sm md:text-[15px] font-semibold items-center justify-center gap-2.5 hover:brightness-110 transition bg-linear-to-b from-[#7b7ff5] to-[#6c6ef0] hover:-translate-y-0.5">
    Start Learning Free
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 12h16m0 0-6-6m6 6-6 6"/>
    </svg>
  </a>

</div>

<script>
function togglePwd(){
  const pwd = document.getElementById('pwd');
  const show = pwd.type === 'password';
  pwd.type = show ? 'text' : 'password';
  document.getElementById('eyeOpen').classList.toggle('hidden', !show);
  document.getElementById('eyeOff').classList.toggle('hidden', show);
}
</script>

</body>

</html>
