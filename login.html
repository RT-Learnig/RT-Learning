
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTLlearning - Welcome</title>
    <link rel="stylesheet" href="/css/output.css">
</head>

<body>

    <main class="bg-black p-6 sm:p-8 md:p-12 lg:p-20 xl:p-32 flex flex-col items-center justify-center min-h-screen">

        <div class="items-center w-full sm:w-[95%] md:w-[85%] lg:w-[75%] bg-blue-950 p-6 sm:p-8 md:p-12 lg:p-20 rounded-4xl shadow-xl shadow-gray-300">

            <div class="text-center text-[28px] sm:text-[32px] md:text-[36px] lg:text-[40px] text-white">
                WELCOME TO
            </div>

            <div class="mb-8 md:mb-12 text-white">
                <span class="flex justify-center gap-3 md:gap-4">
                    <img
                        src="https://img.magnific.com/premium-vector/rtl-logo-rtl-letter-rtl-letter-logo-design-initials-rtl-logo-linked-with-circle-uppercase-monogram-logo-rtl-typography-technology-business-real-estate-brand_229120-67750.jpg?semt=ais_hybrid&w=740&q=80"
                        alt=""
                        width="30"
                        class="rounded-4xl mt-4">

                    <h1 class="text-[18px] md:text-[20px] mt-4">
                        RTLearning
                    </h1>
                </span>
            </div>

            <section class="text-white flex flex-col md:flex-row gap-4 md:gap-8 lg:gap-12">

                <div class="bg-gray-800 p-4 rounded-2xl w-full md:w-[30%]">
                    <div class="text-gray-200">STAGE 01</div>
                    <h3>Beginner</h3>
                    <div class="text-emerald-300">A1 - A2</div>
                    <div class="mt-8 md:mt-16">60 hrs to target</div>
                </div>

                <div class="bg-gray-800 p-4 rounded-2xl w-full md:w-[30%]">
                    <div class="text-gray-200">STAGE 02</div>
                    <h3>Intermediate</h3>
                    <div class="text-emerald-300">B1 - B2</div>
                    <div class="mt-8 md:mt-16">Most popular</div>
                </div>

                <div class="bg-gray-800 p-4 rounded-2xl w-full md:w-[30%]">
                    <div class="text-gray-200">STAGE 03</div>
                    <h3>Advanced</h3>
                    <div class="text-emerald-300">B1 - B2</div>
                    <div class="mt-8 md:mt-16">Fluency polish</div>
                </div>

            </section>

            <div class="gap-4 flex flex-col sm:flex-row mt-8 md:mt-12 text-white">

                <div class="bg-gray-500 p-4 flex gap-4 w-full rounded-md">
                    <span>
                        <img src="https://cdn-icons-png.flaticon.com/128/300/300221.png"
                            alt=""
                            width="20">
                    </span>
                    with google account
                </div>

                <div class="bg-gray-500 p-4 flex gap-4 w-full rounded-md">
                    <span class="facebook">
                        <img src="https://cdn-icons-png.flaticon.com/128/15047/15047435.png"
                            alt=""
                            width="20">
                    </span>
                    with facebook account
                </div>

            </div>

            <div class="text-white">

                <div class="text-center mt-2 mb-2">
                    or
                </div>

                <div class="flex-col flex">
                    <label class="flex flex-col sm:flex-row sm:justify-between text-[18px] md:text-[20px] gap-1">
                        Your Email
                        <span class="text-green-400">♡ Verified ID</span>
                    </label>

                    <input
                        type="text"
                        placeholder="Your Email"
                        class="bg-gray-500 rounded-md p-4 w-full">
                </div>

                <div class="flex-col flex mt-6 md:mt-8">
                    <label class="justify-between flex flex-col sm:flex-row text-[18px] md:text-[20px] gap-1">
                        Your Password
                        <span class="text-blue-600">Forgot?</span>
                    </label>

                    <input
                        type="text"
                        placeholder="Your Password"
                        class="bg-gray-500 rounded-md p-4 w-full">
                </div>

                <label class="flex gap-3 md:gap-4 mt-6 md:mt-8 text-[16px] md:text-[20px] items-center">
                    <input type="checkbox" class="w-6 md:w-10">
                    Remember me for 30 days
                </label>

                <button class="bg-blue-400 p-5 md:p-8 w-full rounded-4xl mt-6 md:mt-8">
                    Start Learning Free ⟶
                </button>

            </div>

        </div>

    </main>

</body>

</html>
